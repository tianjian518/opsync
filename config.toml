# opsync 配置文件（多 OpenList 账号模型）
# 每个 [[openlists]] 是一个 OpenList 账号，下面挂若干 [[openlists.routes]] 搬运路线。
# 账号登录信息会持久化；tested_ok 记录最近一次连接测试是否通过。

[[openlists]]
id = "conn-demo"                    # 唯一标识（保存时自动生成，勿手改）
name = "示例账号"                    # 展示名（网页标签页上显示）
url = "http://127.0.0.1:5244"      # OpenList 地址（占位，请在网页填写并连接测试）
username = "admin"
password = "your_password"         # 占位，请在网页填写并连接测试；127.0.0.1 不会被自动调度
tested_ok = false

  # [[openlists.routes]]            # 每条路线把 src_path 定时搬（复制/移动）到 dst_path
  # name = "路线1"
  # src_path = "/阿里云盘/照片"          # 源目录（网页里可浏览选择）
  # dst_path = "/OneDrive/备份/照片"     # 目标目录
  # mode = "copy"                       # copy = 复制保留源；move = 搬完删源
  # enabled = true                      # 是否启用
  # overwrite = false                   # false = 同名且大小一致就跳过；true = 强制覆盖
  # delete_empty_dirs = false           # move 模式下是否删掉已搬空的源目录
  # schedule_type = "interval"          # interval = 每 N 分钟；daily = 每天定时；once = 只跑一次
  # interval_minutes = 30               # interval 模式：每 30 分钟跑一次
  # run_at = "03:00"                    # daily 模式：每天 03:00 执行
  # min_size = ""                       # 文件大小下限，带单位如 "1GB"；留空 = 不限
  # max_size = "5GB"                    # 文件大小上限，带单位如 "5GB"；留空 = 不限
  #                                     # 粒度是单个文件；范围外的文件留在源目录不动，不会被删

[logging]
level = "INFO"                # DEBUG / INFO / WARNING / ERROR
file = "opsync.log"          # 日志文件路径，留空 "" 则不写文件
