name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

# 需要 packages:write 才能把镜像推到 GHCR；contents:read 用于拉取源码。
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # 启用 QEMU，让 x86 runner 也能构建 arm64 镜像
      - name: 设置 QEMU（多架构仿真）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 推送到 GHCR（用仓库自带的 GITHUB_TOKEN 即可，无需额外秘钥）
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 同时产出 linux/amd64 与 linux/arm64 的多架构镜像，推送到 GHCR
      - name: 构建并推送（多架构）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/tianjian518/opsync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
